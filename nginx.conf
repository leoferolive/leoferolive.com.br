server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Security headers (aplicados no server; locations com add_header próprio precisam repetir).
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # connect-src: site fetches the chat backend on its own subdomain.
  # script-src + frame-src: Cloudflare Turnstile widget (lazy-loaded by the chat drawer).
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://chat.leoferolive.com.br https://chat-dev.leoferolive.com.br https://challenges.cloudflare.com https://static.cloudflareinsights.com; script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  # Cache-Control default — HTML/SPA shell e tudo que não casar com um location específico.
  # Rebuilds (nova meta, novo JSON-LD) refletem rápido nos crawlers.
  add_header Cache-Control "public, max-age=0, must-revalidate" always;

  # SPA fallback — qualquer rota desconhecida cai no index.html (React Router resolve)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Health endpoint (usado por K8s probes)
  location /health {
    default_type text/plain;
    return 200 'ok';
  }

  # sitemap/robots: TTL curto (1h). add_header em location não herda do server,
  # então repetimos os security headers críticos.
  location = /sitemap.xml {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=3600" always;
  }
  location = /robots.txt {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Cache agressivo em assets versionados (Vite hash). Repetimos security headers
  # pelo mesmo motivo de não-herança do add_header.
  location ~* \.(js|css|woff2|svg|webp|avif|png|jpg|jpeg|gif)$ {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://chat.leoferolive.com.br https://chat-dev.leoferolive.com.br https://challenges.cloudflare.com https://static.cloudflareinsights.com; script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # gzip
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json text/plain;
  gzip_min_length 1024;
}
